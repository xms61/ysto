name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow reruns every job before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Tracked-files checker tests
        run: node --test scripts/check-tracked-files.test.mjs
      - name: Tracked files (media, data, secrets, home-folder paths)
        run: node scripts/check-tracked-files.mjs
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A pull request scans its own commits; a push to main scans the whole history.
      - name: Secrets and home-folder paths in history (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then range="$BASE_SHA..$HEAD_SHA"; else range="--all"; fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --log-opts="$range" .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Doc checker tests
        run: node --test scripts/check-docs.test.mjs
      - name: Doc checks
        run: node scripts/check-docs.mjs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The catalog's audio tests and the clip tests generate tones and cut them with ffmpeg and ffprobe.
      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg
      - name: Lint, format, typecheck, tests with coverage, web tests
        run: npm run test:ci
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The clip decode test and the fixture server make tones with ffmpeg.
      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg
      # The browsers are kept in the Actions cache per Playwright version, which pins their builds; the system
      # libraries they need still come from apt, and are mostly on the runner image already.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The fixture's tones are made with ffmpeg.
      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg
      - name: Build the image
        run: docker build -t ysto:ci .
      - name: Start it on the fixture catalog, hardened as on the VPS
        run: |
          node e2e/fixture-data.ts "$RUNNER_TEMP/fixture"
          echo "HARDENING=--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true" >> "$GITHUB_ENV"
          echo "FIXTURE=-v $RUNNER_TEMP/fixture/audio:/data/audio:ro -v $RUNNER_TEMP/fixture/catalog:/data/catalog:ro" >> "$GITHUB_ENV"
      - name: Ready on /readyz
        run: |
          docker run -d --name ysto -p 127.0.0.1:3000:3000 $HARDENING $FIXTURE ysto:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/readyz; then exit 0; fi
            sleep 1
          done
          docker logs ysto
          exit 1
      - name: Clips cut in the image
        run: docker run --rm $HARDENING $FIXTURE ysto:ci node scripts/clips/bench.ts --count 3 --length 10
      - name: Reports kept in the state volume
        run: |
          docker volume create ysto-ci-state
          STATE="-v ysto-ci-state:/data/state"
          docker run --rm $HARDENING $FIXTURE $STATE ysto:ci node --input-type=module -e "
            const { openReports } = await import('./server/reports.ts');
            const { createLogger } = await import('./server/log.ts');
            const reports = openReports('/data/state', createLogger('error'));
            reports.add({ at: 1, themeId: 1, startMs: 0, reason: 'silent' });
            reports.close();"
          docker run --rm $HARDENING $FIXTURE $STATE ysto:ci node scripts/clip-reports/list.ts | tee "$RUNNER_TEMP/reports.txt"
          grep -q '^1 reports on 1 clips' "$RUNNER_TEMP/reports.txt"
      - name: No audio, database or .env file in the image
        run: |
          # Root, so find can read every folder; the server itself runs as node.
          patterns=(-iname '*.ogg' -o -iname '*.opus' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.aac'
            -o -iname '*.flac' -o -iname '*.wav' -o -iname '*.sqlite*' -o -iname '*.db' -o -name '.env*')
          found=$(docker run --rm --user root --entrypoint find ysto:ci / -xdev -type f \( "${patterns[@]}" \))
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Fixable high and critical vulnerabilities (Trivy)
        run: '"$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress ysto:ci'
