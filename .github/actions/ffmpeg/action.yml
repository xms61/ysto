name: Install ffmpeg
description: >-
  Installs ffmpeg and ffprobe from .deb files kept in the Actions cache. The Ubuntu mirror the runners use can take a
  quarter of an hour for the 63 MB, so the packages are downloaded once per runner image and installed from the cache
  after that.
runs:
  using: composite
  steps:
    # The packages a download fetches are exactly those missing from this runner image, so the cache is keyed to it.
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ffmpeg-debs
        key: ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
    - name: Download the packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.ffmpeg-debs/partial
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends --download-only \
          -o Dir::Cache::archives="$HOME/.ffmpeg-debs" ffmpeg
        sudo chown -R "$USER" ~/.ffmpeg-debs
    - name: Install from the packages
      shell: bash
      run: |
        sudo dpkg -i ~/.ffmpeg-debs/*.deb > /dev/null
        ffmpeg -version | head -n 1
        ffprobe -version | head -n 1
