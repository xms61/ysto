version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows and the local actions current; the version comments update
  # with them.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Minor and patch updates arrive as one grouped PR; each major gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint supports TypeScript below 6.1 (see the tech-debt tracker).
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The Node types follow the Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The base image digest in the Dockerfile and the Caddy digest in the VPS's compose file.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
